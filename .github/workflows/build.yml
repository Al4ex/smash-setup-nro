name: Build Smash Setup NRO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libnx
        run: dkp-pacman -Sy --noconfirm switch-libnx

      - name: Build NRO
        run: make

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: smash-setup-nro
          path: smash_setup.nro
